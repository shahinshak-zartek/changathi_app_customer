name: Changathi
description: "Changathi — Friend Calling App."
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ^3.8.1


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Shared platform logic (services, controllers, models, repositories, config).
  zartek_core:
    path: ../Zartek_calling_customer_core_for_clone_changathi_customer

  # Firebase (client owns its own Firebase project + options).
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0

  # UI / presentation packages used by this client's own screens & widgets.
  flutter_riverpod: 3.1.0   # pinned to match zartek_core generated code (riverpod 3.1.x)
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  pinput: ^6.0.2
  fluttertoast: ^9.1.0
  flutter_platform_widgets: ^10.0.1
  flutter_form_builder: ^10.0.1
  form_builder_validators: ^11.1.1
  country_picker: ^2.0.27
  flutter_markdown: ^0.7.7+1
  share_plus: ^12.0.1
  screen_protector: ^1.5.1
  package_info_plus: ^9.0.1
  intl: ^0.20.2
  agora_rtc_engine: ^6.5.3
  livekit_client: ^2.7.0
  facebook_app_events: ^0.30.5
  firebase_auth: ^6.5.5
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path_android: "assets/icons/app_icon0.png"
  image_path_ios: "assets/icons/app_icon_with_bg.png"
  adaptive_icon_foreground: "assets/icons/app_icon0.png"
  adaptive_icon_background: "#000000"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
